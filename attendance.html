<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#153b70">
    <meta name="description" content="M.P. Mission School web app">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Student Attendance - M.P. Mission School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="school-logo">MP</div>
    <div>
        <h1>M.P. Mission School</h1>
        <p>Student Attendance System</p>
    </div>
</header>

<main class="admin-container">

    <h2>Manage Attendance</h2>

    <label>Select Date</label>
    <input type="date" id="attendanceDate">

    <label>Select Class</label>
    <select id="ClassSelect">
        <option value="">Select Class</option>
        <option>Nursery</option>
        <option>LKG</option>
        <option>UKG</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
    </select>

    <button onclick="loadStudents()">Load Students</button>

    <div id="attendanceList"></div>

    <div id="attendanceSummary"></div>

    <button onclick="saveAttendance()">Save Attendance</button>

    <button class="logout"
        onclick="window.location.href='admin.html'">
        Back to Dashboard
    </button>

</main>

<script src="script.js"></script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(function (error) { console.error("Service worker registration failed:", error); });
    });
}
</script>
</body>
</html>
