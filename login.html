
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#153b70">
    <meta name="description" content="M.P. Mission School web app">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Login Portal - M.P. Mission School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="school-logo">MP</div>
        <div>
            <h1>M.P. Mission School</h1>
            <p>School Login Portal</p>
        </div>
    </header>

    <main class="login-container">
        <div class="login-box">

            <h2>Welcome Back!</h2>
            <p>Select Your Login Type</p>

            <form id="loginForm">

                <label>Select Role</label>
                <select id="userRole" required>
                    <option value="">Select Login Type</option>
                    <option value="admin">Admin</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>

                <label>Username / Roll Number</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username or Roll Number"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

                <button type="submit">Login</button>

                <p id="message"></p>

            </form>

            <a href="index.html">Back to Home</a>

        </div>
    </main>

    <script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(function (error) { console.error("Service worker registration failed:", error); });
    });
}
</script>
</body>
</html>
