
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#153b70">
    <meta name="description" content="M.P. Mission School web app">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Student Management - M.P. Mission School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="school-logo">MP</div>
    <div>
        <h1>M.P. Mission School</h1>
        <p>Student Management</p>
    </div>
</header>

<main class="admin-container">

    <h2>Manage Students</h2>
    <p>Add and manage school students.</p>

    <form id="studentForm" class="login-box">
        <h3 id="studentFormTitle">Add New Student</h3>

        <label>Student Name</label>
        <input type="text" id="studentName" required>

        <label>Roll Number</label>
        <input type="text" id="rollNumber" required>

        <label>Class</label>
        <select id="studentClass" required>
            <option value="">Select Class</option>
            <option>Nursery</option>
            <option>LKG</option>
            <option>UKG</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
        </select>

        <label>Mobile Number</label>
        <input type="tel" id="studentMobile"
               pattern="[0-9]{10}" maxlength="10" required>

        <button type="submit" id="studentSubmitButton">Add Student</button>
        <button type="button" id="cancelEditButton"
                style="display:none;" onclick="cancelStudentEdit()">
            Cancel Edit
        </button>
    </form>

    <h2>Student List</h2>

    <input
        type="search"
        id="studentSearch"
        placeholder="Search by student name or roll number..."
        style="width:100%; padding:12px; margin-bottom:15px;"
    >

    <div id="studentList"></div>

    <!-- STUDENT HOMEWORK -->
    <section class="homework-section">
        <h2>Homework Records</h2>
        <div id="studentHomeworkList"></div>
    </section>

    <br>

    <button class="logout"
            onclick="window.location.href='admin.html'">
        Back to Dashboard
    </button>

</main>

<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(function (error) { console.error("Service worker registration failed:", error); });
    });
}
</script>
</body>
</html>
