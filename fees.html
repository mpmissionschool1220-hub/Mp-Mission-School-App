
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#153b70">
    <meta name="description" content="M.P. Mission School web app">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Fee Management - M.P. Mission School</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1, h2 {
            text-align: center;
            color: #1d4ed8;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            padding: 11px 16px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .fee-card {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            margin-top: 12px;
        }

        .back-btn { background: #475569; }
    </style>
</head>

<body>
<div class="container">

    <h1>M.P. MISSION SCHOOL</h1>
    <h2>Fee Management System</h2>

    <div class="box">
        <h2>Submit Student Fee</h2>

        <form id="feeForm">

            <label>Student Name</label>
            <input type="text" id="feeStudentName" required>

            <label>Roll Number</label>
            <input type="text" id="feeRoll" required>

            <label>Class</label>
            <select id="feeClass" required>
                <option value="">Select Class</option>
                <option>Nursery</option>
                <option>LKG</option>
                <option>UKG</option>
                <option>1st</option>
                <option>2nd</option>
                <option>3rd</option>
                <option>4th</option>
                <option>5th</option>
                <option>6th</option>
                <option>7th</option>
                <option>8th</option>
                <option>9th</option>
                <option>10th</option>
            </select>

            <label>Total Annual Fee (₹)</label>
            <input type="number" id="totalFee" min="0" required>

            <label>Fee Paid Now (₹)</label>
            <input type="number" id="paidFee" min="0" required>

            <label>Payment Date</label>
            <input type="date" id="feeDate" required>

            <label>Payment Method</label>
            <select id="paymentMethod" required>
                <option value="">Select Method</option>
                <option>Cash</option>
                <option>UPI</option>
                <option>Bank Transfer</option>
                <option>Cheque</option>
            </select>

            <button type="submit">Save Fee Record</button>
        </form>
    </div>

    <div class="box">
        <h2>Fee Records</h2>
        <div id="feeList">No Fee Records Yet.</div>
    </div>

    <button class="back-btn" onclick="window.location.href='admin.html'">
        Back to Dashboard
    </button>

</div>

<script src="script.js"></script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
            .catch(function (error) { console.error("Service worker registration failed:", error); });
    });
}
</script>
</body>
</html>
